<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open in Archive</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.45 system-ui, sans-serif;
        --canvas: #f1f4fa;
        --card: #fff;
        --text: #18243a;
        --muted: #4e5d75;
        --line: #ccd5e3;
        --track: #ebeff6;
        --accent: #1d4ed8;
        --selected: #e2eaff;
        --status: #146044;
        --status-bg: #e5f5ed;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #111723;
          --card: #192130;
          --text: #edf2fc;
          --muted: #b4c1d6;
          --line: #3e4c63;
          --track: #222d40;
          --accent: #b1c6ff;
          --selected: #2b416c;
          --status: #a6ebcc;
          --status-bg: #203f37;
        }
      }

      * { box-sizing: border-box; }

      body {
        width: 100%;
        min-width: 320px;
        margin: 0;
        padding: 12px;
        background: var(--canvas);
        color: var(--text);
      }

      main {
        max-width: 420px;
        margin: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
      }

      header, .shortcut-row, .shortcut-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      header, .shortcut-row { justify-content: space-between; }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      #status:not(:empty) {
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--status-bg);
        color: var(--status);
        font-weight: 600;
      }

      form {
        display: grid;
        gap: 12px;
        margin: 14px 0;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend, .field-label {
        display: block;
        margin-bottom: 5px;
        padding: 0;
        font-weight: 650;
      }

      .segments {
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: 8px;
        background: var(--track);
      }

      .segments input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        clip-path: inset(50%);
      }

      .segments label {
        flex: 1;
        padding: 6px 4px;
        border: 1px solid transparent;
        border-radius: 6px;
        text-align: center;
        white-space: nowrap;
        cursor: pointer;
      }

      .segments label:hover, button:hover { background: var(--track); }
      .segments label:hover { border-color: var(--line); }

      .segments input:checked + label {
        border-color: var(--accent);
        background: var(--selected);
        color: var(--accent);
        font-weight: 650;
      }

      select, button, kbd {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
      }

      select, button {
        padding: 6px 8px;
        background: var(--card);
      }

      select { width: 100%; }
      button { cursor: pointer; }

      :is(select, button):focus-visible,
      .segments input:focus-visible + label {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .shortcut-row {
        flex-wrap: wrap;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      kbd {
        padding: 2px 5px;
        background: var(--track);
      }

      footer {
        margin-top: 10px;
        color: var(--muted);
      }

      #status, kbd, footer { font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Open in Archive</h1>
        <span id="status" role="status"></span>
      </header>
      <form id="settings" inert>
        <fieldset>
          <legend>Mode</legend>
          <div class="segments">
            <input type="radio" id="viewer" name="mode" value="viewer" checked>
            <label for="viewer">Latest snapshot</label>
            <input type="radio" id="capture" name="mode" value="capture">
            <label for="capture">Fresh snapshot</label>
          </div>
        </fieldset>
        <div>
          <label class="field-label" for="mirror">Mirror</label>
          <select id="mirror" name="mirror">
            <option value="archive.ph">archive.ph</option>
            <option value="archive.is">archive.is</option>
            <option value="archive.today">archive.today</option>
          </select>
        </div>
        <fieldset>
          <legend>Open in</legend>
          <div class="segments">
            <input type="radio" id="new-tab" name="openIn" value="tab" checked>
            <label for="new-tab">New tab</label>
            <input type="radio" id="background-tab" name="openIn" value="background">
            <label for="background-tab">Background tab</label>
            <input type="radio" id="same-tab" name="openIn" value="same">
            <label for="same-tab">Same tab</label>
          </div>
        </fieldset>
      </form>
      <div class="shortcut-row">
        <div class="shortcut-label">
          <strong>Shortcut</strong>
          <kbd id="shortcut">…</kbd>
        </div>
        <button type="button" id="edit-shortcut">Edit shortcut</button>
      </div>
      <footer>
        Tracking parameters (utm_*, fbclid…) are removed before archiving.<br>
        Fresh snapshots are public. Do not use them on private or logged-in links.
      </footer>
    </main>
    <script src="options.js" defer></script>
  </body>
</html>
