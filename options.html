<!doctype html>
<html>
  <head>
    <title>Archive.is Redirector Options</title>
    <style>
      :root {
        --primary: #2563eb;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e293b;
        --border: #e2e8f0;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        background: var(--card);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        width: 100%;
        max-width: 500px;
        border: 1px solid var(--border);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        color: var(--primary);
      }
      .section {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      select,
      textarea {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        box-sizing: border-box;
      }
      textarea {
        height: 80px;
        resize: vertical;
        margin-top: 0.5rem;
      }
      .hint {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 0.25rem;
      }
      .toggle {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #cbd5e1;
        transition: 0.4s;
        border-radius: 24px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: var(--primary);
      }
      input:checked + .slider:before {
        transform: translateX(20px);
      }
      button {
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      button:hover {
        background-color: #1d4ed8;
      }
      #status {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        height: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Archive.is Settings</h1>

      <div class="section row">
        <label for="enabled">Enable Auto-Redirect</label>
        <label class="toggle">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="section">
        <label for="mode">Redirection Mode</label>
        <select id="mode">
          <option value="viewer">Viewer (Archive Snapshot)</option>
          <option value="capture">Capture (Force New Snapshot)</option>
        </select>
        <div class="hint">
          Viewer redirects to existing snapshots if available.
        </div>
      </div>

      <div class="section row">
        <label for="onlyOnClicks">Only redirect on link clicks</label>
        <label class="toggle">
          <input type="checkbox" id="onlyOnClicks" />
          <span class="slider"></span>
        </label>
        <div class="hint" style="width: 100%; margin-top: 0">
          If ON, typed URLs won't redirect.
        </div>
      </div>

      <div class="section">
        <label for="exclusions">Exclusion List (One domain per line)</label>
        <textarea
          id="exclusions"
          placeholder="example.com&#10;other.org"
        ></textarea>
        <div class="hint">Always excludes archive.is and related domains.</div>
      </div>

      <div class="section">
        <label for="inclusions">Inclusion List (Optional)</label>
        <textarea id="inclusions" placeholder="news-site.com"></textarea>
        <div class="hint">If set, ONLY these domains will redirect.</div>
      </div>

      <button id="save">Save Settings</button>
      <div id="status"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
