name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node url.test.mjs
      - run: node --check background.js && node --check options.js
      - name: Check manifest files
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          for (const path of [
            manifest.background.service_worker, manifest.options_ui.page,
            ...Object.values(manifest.icons), ...Object.values(manifest.action.default_icon)
          ]) {
            assert.ok(fs.statSync(path, { throwIfNoEntry: false })?.isFile(), `Missing manifest file: ${path}`);
          }
          NODE
